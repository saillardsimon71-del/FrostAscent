name: RenderWolf export bridge checks

on:
  push:
    paths:
      - 'tools/renderwolf_*'
      - 'tools/renderwolf-browser/**'
      - 'tests/test_renderwolf_*'
      - '.github/workflows/renderwolf-bridge-ci.yml'
  pull_request:
    paths:
      - 'tools/renderwolf_*'
      - 'tools/renderwolf-browser/**'
      - 'tests/test_renderwolf_*'
      - '.github/workflows/renderwolf-bridge-ci.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python importer tests
        run: python -m unittest discover -s tests -p 'test_renderwolf_bridge.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript manifest and browser core tests
        run: node --test tests/test_renderwolf_manifest.mjs tools/renderwolf-browser/test-core.mjs tools/renderwolf-browser/test-agent.mjs

      - name: Chromium adapter and Chrome extension syntax checks
        run: |
          node --check tools/renderwolf-browser/cli.mjs
          node --check tools/renderwolf-browser/agent.mjs
          node --check tools/renderwolf-browser/agent-core.mjs
          node --check tools/renderwolf-browser/agent-observe.mjs
          node --check tools/renderwolf-browser/deepseek-client.mjs
          node --check tools/renderwolf-browser/inspector.mjs
          node --check tools/renderwolf-browser/session.mjs
          node --check tools/renderwolf-browser/chrome-extension/popup.js
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('tools/renderwolf-browser/chrome-extension/manifest.json'));if(m.manifest_version!==3||m.host_permissions.some(x=>!x.includes('renderwolf.ai')))process.exit(1)"
