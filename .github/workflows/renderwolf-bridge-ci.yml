name: RenderWolf export bridge checks

on:
  push:
    paths:
      - 'tools/renderwolf_*'
      - 'tools/renderwolf-browser/**'
      - 'tests/test_renderwolf_*'
      - '.github/workflows/renderwolf-bridge-ci.yml'
  pull_request:
    paths:
      - 'tools/renderwolf_*'
      - 'tools/renderwolf-browser/**'
      - 'tests/test_renderwolf_*'
      - '.github/workflows/renderwolf-bridge-ci.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python importer tests
        run: python -m unittest discover -s tests -p 'test_renderwolf_bridge.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript manifest and browser core tests
        run: node --test tests/test_renderwolf_manifest.mjs tools/renderwolf-browser/test-core.mjs
